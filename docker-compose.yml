services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: deskflow
      POSTGRES_DB: deskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://deskflow:deskflow@db:5432/deskflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-docker-secret-not-for-production-use
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # The slim image has no curl; the API is up once /api/health answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    environment:
      # The same image as the api; this variable is the only difference.
      SERVICE_ROLE: worker
      DATABASE_URL: postgresql+asyncpg://deskflow:deskflow@db:5432/deskflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-docker-secret-not-for-production-use
    depends_on:
      redis:
        condition: service_started
      api:
        # The api container applies migrations on start, so wait for it to be healthy.
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  pgdata:
