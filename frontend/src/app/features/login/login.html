<main class="login">
  <mat-card appearance="outlined" class="login__card">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card-header>
      <mat-card-title>DeskFlow</mat-card-title>
      <mat-card-subtitle>IT Helpdesk &amp; Asset Management</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (error(); as message) {
          <p class="login__error" role="alert">{{ message }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">
          Sign in
        </button>
      </form>

      <section class="login__demo">
        <p>Try a demo account:</p>
        <div class="login__demo-buttons">
          @for (account of demoAccounts; track account.email) {
            <button mat-stroked-button type="button" (click)="fillDemo(account.email)">
              {{ account.label }}
            </button>
          }
        </div>
        <p class="login__demo-note">Demo data resets daily.</p>
      </section>
    </mat-card-content>
  </mat-card>
</main>
